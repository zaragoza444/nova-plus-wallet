<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080C" />
    <title>Nova Trusty Technologies Ltd</title>
    <meta
      name="description"
      content="Nova Trusty Technologies Ltd. Nova+, Nova X, Nova Swap, Nova Bridge, and Nova AI Builder on NovaONE 22016 and NRW 33001."
    />
    <script>
      (function () {
        try {
          var p = sessionStorage.getItem("npw:spa");
          if (p) {
            sessionStorage.removeItem("npw:spa");
            var cur = location.pathname + location.search + location.hash;
            if (p !== cur) history.replaceState(null, "", p);
          }
        } catch (e) {}
        var prefix = "%BASE_URL%".replace(/\/$/, "");
        var path = location.pathname;
        var rest = prefix && path.indexOf(prefix) === 0 ? path.slice(prefix.length) : path;
        if (!rest) rest = "/";
        if (rest !== "/" && location.hash === "") {
          location.replace((prefix || "") + "/#" + rest + location.search);
        }
      })();
    </script>
    <script src="%BASE_URL%integrity.js"></script>
  </head>
  <body class="bg-signet-bg text-signet-text font-body antialiased min-h-[100dvh] overflow-x-hidden grain-overlay">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
