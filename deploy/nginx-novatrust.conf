# Draft — do not install. Nova Trusty Technologies Ltd at https://novatrust.uk/
# Vite build with base /. Refresh must serve index.html, not a file 404.
# Hash routes (#/onex, #/plus, #/app/swap, #/app/bridge) work without this file.
location / {
    root /var/www/novatrust;
    try_files $uri $uri/ /index.html;
}
