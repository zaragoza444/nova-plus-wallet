<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nova Plus Wallet</title>
    <script>
      (function () {
        var loc = window.location;
        var segs = loc.pathname.split("/").filter(Boolean);
        var known = ["wallet", "nova-plus-wallet"];
        var idx = -1;
        for (var i = 0; i < segs.length; i++) {
          if (known.indexOf(segs[i]) !== -1) idx = i;
        }
        var base = idx >= 0 ? "/" + segs.slice(0, idx + 1).join("/") + "/" : "/";
        var rest = (idx >= 0 ? segs.slice(idx + 1) : segs).join("/");
        var hash = "#/" + rest + loc.search;
        loc.replace(loc.protocol + "//" + loc.host + base + hash);
      })();
    </script>
  </head>
  <body>Loading Nova Plus Wallet…</body>
</html>
